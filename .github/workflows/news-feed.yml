name: Auto-Post Construction News

on:
  schedule:
    - cron: "*/15 * * * *"  # Runs every 15 minutes
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write  # Ensures GitHub Actions can push changes to the repo

jobs:
  post_news:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v3

      - name: 🏗️ Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install Dependencies
        run: pip install --upgrade requests tweepy openai feedparser

      - name: 🚀 Run Script
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_SECRET: ${{ secrets.TWITTER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python news-feed.py  # Runs your bot script

      - name: 🔄 Commit and Push Updates (posted_news.json)
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add posted_news.json
          git commit -m "Update posted_news.json [Automated]" || echo "No changes to commit"
          git push origin main || echo "Push failed, check GitHub Actions permissions"
